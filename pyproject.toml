[project]
name = "triton-gated-mlp"
version = "0.0.1"
description = "Triton implementation of gated-mlp module."
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Matteo Bonotto", email = "m.bonotto@outlook.com" }]
dependencies = [
  "numpy",
  "triton~=3.5.0",
  "torch~=2.9.0",
  "matplotlib~=3.10.7",
  "pandas~=2.3.3",
  "psutil~=7.1.3",
  "tqdm~=4.67.1",
  "smac~=2.3.1",
  "ConfigSpace~=1.2.1",
  "triton-dejavu @ git+https://github.com/IBM/triton-dejavu.git",
]

[project.optional-dependencies]
dev = [
  "black",
  "mypy",
  "pytest",
  "ipykernel>=6.0,<7.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["triton_gated_mlp*"]
